[project]
name = "carrier-voice-agent"
version = "0.1.0"
description = "Inbound carrier-sales voice agent using LiveKit and Twilio SIP"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=0.30.0",
    "edge-tts>=6.1.0",
    "faster-whisper>=1.0.0",
    "livekit-agents>=1.0",
    "livekit-plugins-silero",
    "numpy>=1.24.0",
    "python-dotenv",
    "pyttsx3>=2.90",
    "soundfile>=0.12.1",
    "torch>=2.2.0",
    "transformers>=4.44.0",
]

[tool.uv]
package = false
