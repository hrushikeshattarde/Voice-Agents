[project]
name = "lanevoice"
version = "0.1.0"
description = "In-house carrier-sales voice AI agent (LiveKit SIP + OpenRouter STT/LLM/TTS)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.40",          # LLM_PROVIDER=anthropic (official SDK)
    "httpx>=0.27",              # Transport Pro Public API client; OpenRouter TTS
    "openai>=1.40",             # LLM_PROVIDER=openrouter (OpenAI-compatible gateway)
    "livekit-agents>=1.0",
    # STT: the OpenAI plugin pointed at OpenRouter's base URL, which serves the
    # same /audio/transcriptions shape.
    "livekit-plugins-openai",
    "livekit-plugins-noise-cancellation>=0.3.0",
    "livekit-plugins-silero",
    "num2words>=0.5.14",
    "numpy>=1.24.0",
    "pydantic-settings>=2.0",
    "python-dotenv",
    "soundfile>=0.12.1",
    # Transport Pro stops carry an `ianaTimezone`; Windows ships no zone database,
    # so without this a pickup time falls back to the numeric UTC offset.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
lanevoice-worker = "lanevoice.telephony.worker:main"
lanevoice-demo = "lanevoice.demo:main"
lanevoice-initdb = "lanevoice.db.database:main"
lanevoice-tpcheck = "lanevoice.integrations.transportpro.check:main"
lanevoice-dashboard = "lanevoice.dashboard.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lanevoice"]
# The bundled US city table (`lanevoice/data/us_cities.csv.gz`) is what lets the
# agent tell a carrier roughly how far their truck is from the pickup without a
# geocoding call. Named explicitly so a packaging change can't silently drop it —
# the symptom would be the agent quietly never mentioning distance again, with no
# error anywhere. `tests/test_geo.py` asserts it loads.
# The dashboard's static assets ride along for the same reason: without them
# `lanevoice-dashboard` serves 404s for its own UI.
# The practice-mode customer profiles are data files too — dropped from the
# wheel, the symptom would be the dashboard refusing to boot with "No practice
# profiles found". `tests/test_practice_profiles.py` asserts the set loads.
artifacts = [
    "src/lanevoice/data/*.csv.gz",
    "src/lanevoice/dashboard/static/*",
    "src/lanevoice/practice/data/*.toml",
    "src/lanevoice/practice/data/profiles/*.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]  # `str, Enum` base is intentional (stable JSON/SQL values)
