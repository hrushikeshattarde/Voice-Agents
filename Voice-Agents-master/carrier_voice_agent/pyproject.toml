[project]
name = "lanevoice"
version = "0.1.0"
description = "In-house carrier-sales voice AI agent (LiveKit SIP + Groq STT/LLM/TTS)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "groq>=0.11.0",
    "httpx>=0.27",              # Transport Pro Public API client
    "livekit-agents>=1.0",
    "livekit-plugins-groq",
    "livekit-plugins-noise-cancellation>=0.3.0",
    "livekit-plugins-silero",
    "num2words>=0.5.14",
    "numpy>=1.24.0",
    "pydantic-settings>=2.0",
    "python-dotenv",
    "soundfile>=0.12.1",
    # Transport Pro stops carry an `ianaTimezone`; Windows ships no zone database,
    # so without this a pickup time falls back to the numeric UTC offset.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
lanevoice-worker = "lanevoice.telephony.worker:main"
lanevoice-demo = "lanevoice.demo:main"
lanevoice-initdb = "lanevoice.db.database:main"
lanevoice-tpcheck = "lanevoice.integrations.transportpro.check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lanevoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]  # `str, Enum` base is intentional (stable JSON/SQL values)
